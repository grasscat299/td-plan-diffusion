<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" width="1320" height="800" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker>
  </defs>
  <style>
    .t { fill: #0b0b0b; font-size: 15px; }
    .h { fill: #0b0b0b; font-size: 16px; font-weight: 700; }
    .s { fill: #52514e; font-size: 13px; }
    .k { fill: #52514e; font-size: 12px; }
    .box { fill: #ffffff; stroke: #c9c8c2; stroke-width: 1.2; }
  </style>
  <rect width="1320" height="800" fill="#fcfcfb"/>

  <text x="20" y="34" class="h" style="font-size:19px">モデルの構成（基準 B25）</text>
  <text x="20" y="56" class="s">d = 128、各タワー 6 層、注意のヘッド 4。拡散するのは配置の枠だけで、敵と資源のタワーは同じ forward で時系列を直接予測する</text>

  <!-- ===== inputs ===== -->
  <text x="20" y="92" class="k">入力</text>
  <rect x="20" y="100" width="300" height="120" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="34" y="124" class="h">敵（最大 84 体 × 300 秒）</text>
  <text x="34" y="148" class="s">通り道（最大 64 点・待機時間）</text>
  <text x="34" y="166" class="s">　→ RouteKVEncoder（2 層）</text>
  <text x="34" y="186" class="s">敵の属性 23 列、出現直後の位置・HP</text>
  <text x="34" y="204" class="s">（既知の値）と学習可能なクエリ</text>

  <rect x="20" y="236" width="300" height="78" rx="8" class="box"/>
  <text x="34" y="260" class="h">盤面 13 × 9 升</text>
  <text x="34" y="282" class="s">地形・升の特徴 13 列・行列の位置埋め込み</text>
  <text x="34" y="300" class="s">→ Transformer 1 層 → 117 トークン</text>

  <rect x="20" y="330" width="300" height="118" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.2"/>
  <text x="34" y="354" class="h">配置の枠 24 個（拡散する）</text>
  <text x="34" y="378" class="s">ノイズの入った計画 x_t（1 枠 131 次元）</text>
  <text x="34" y="398" class="s">キャラクターの属性 66 列</text>
  <text x="34" y="418" class="s">射程の形（11 × 7 の格子）</text>
  <text x="34" y="436" class="s">枠の番号の位置埋め込み</text>

  <rect x="20" y="464" width="300" height="70" rx="8" fill="#e5f5ef" stroke="#1baf7a" stroke-width="1.2"/>
  <text x="34" y="488" class="h">資源（300 秒）</text>
  <text x="34" y="510" class="s">学習可能なクエリ＋時刻の位置埋め込み</text>

  <!-- ===== layer block ===== -->
  <rect x="350" y="74" width="640" height="490" rx="12" fill="none" stroke="#8a8984" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="970" y="96" class="t" text-anchor="end" style="font-weight:700">× 6 層</text>

  <!-- enemy lane -->
  <rect x="370" y="128" width="130" height="64" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="435" y="146" class="k" text-anchor="middle" style="fill:#2a78d6;font-weight:700">敵タワー</text>
  <text x="435" y="166" class="t" text-anchor="middle">self-attention</text>
  <text x="435" y="184" class="k" text-anchor="middle">時間の方向</text>
  <rect x="530" y="128" width="190" height="64" rx="7" class="box"/>
  <text x="625" y="156" class="t" text-anchor="middle">cross-attention</text>
  <text x="625" y="176" class="k" text-anchor="middle">通り道 ＋ 配置の枠</text>
  <rect x="860" y="128" width="110" height="64" rx="7" class="box"/>
  <text x="915" y="165" class="t" text-anchor="middle">MLP</text>
  <line x1="500" y1="160" x2="526" y2="160" stroke="#52514e" stroke-width="1.6" marker-end="url(#aG)"/>
  <line x1="720" y1="160" x2="856" y2="160" stroke="#52514e" stroke-width="1.6" marker-end="url(#aG)"/>

  <!-- ope lane -->
  <rect x="370" y="310" width="130" height="64" rx="7" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/>
  <text x="435" y="328" class="k" text-anchor="middle" style="fill:#eb6834;font-weight:700">配置タワー</text>
  <text x="435" y="348" class="t" text-anchor="middle">self-attention</text>
  <text x="435" y="366" class="k" text-anchor="middle">枠どうし</text>
  <rect x="530" y="310" width="190" height="64" rx="7" class="box"/>
  <text x="625" y="338" class="t" text-anchor="middle">cross-attention</text>
  <text x="625" y="358" class="k" text-anchor="middle">敵 84 × 16 ＋ 資源 16</text>
  <rect x="740" y="310" width="110" height="64" rx="7" class="box"/>
  <text x="795" y="338" class="t" text-anchor="middle">cross-attn</text>
  <text x="795" y="358" class="k" text-anchor="middle">盤面</text>
  <rect x="860" y="310" width="110" height="64" rx="7" class="box"/>
  <text x="915" y="347" class="t" text-anchor="middle">MLP</text>
  <line x1="500" y1="342" x2="526" y2="342" stroke="#52514e" stroke-width="1.6" marker-end="url(#aG)"/>
  <line x1="720" y1="342" x2="736" y2="342" stroke="#52514e" stroke-width="1.6" marker-end="url(#aG)"/>
  <line x1="850" y1="342" x2="856" y2="342" stroke="#52514e" stroke-width="1.6" marker-end="url(#aG)"/>

  <!-- resource lane -->
  <rect x="370" y="488" width="130" height="64" rx="7" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
  <text x="435" y="506" class="k" text-anchor="middle" style="fill:#1baf7a;font-weight:700">資源タワー</text>
  <text x="435" y="526" class="t" text-anchor="middle">self-attention</text>
  <text x="435" y="544" class="k" text-anchor="middle">時間の方向</text>
  <rect x="530" y="488" width="190" height="64" rx="7" class="box"/>
  <text x="625" y="516" class="t" text-anchor="middle">cross-attention</text>
  <text x="625" y="536" class="k" text-anchor="middle">配置の枠</text>
  <rect x="860" y="488" width="110" height="64" rx="7" class="box"/>
  <text x="915" y="525" class="t" text-anchor="middle">MLP</text>
  <line x1="500" y1="520" x2="526" y2="520" stroke="#52514e" stroke-width="1.6" marker-end="url(#aG)"/>
  <line x1="720" y1="520" x2="856" y2="520" stroke="#52514e" stroke-width="1.6" marker-end="url(#aG)"/>

  <!-- cross-lane: enemy SA -> compress -> ope CA (blue) -->
  <path d="M470,192 L470,232 L565,232 L565,306" fill="none" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="478" y="226" class="k" style="fill:#2a78d6">時間を 300 → 16 に圧縮</text>
  <!-- cross-lane: ope SA -> enemy CA (orange) -->
  <path d="M400,310 L400,252 L680,252 L680,196" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#aO)"/>
  <!-- cross-lane: ope SA -> resource CA (orange) -->
  <path d="M400,374 L400,430 L680,430 L680,484" fill="none" stroke="#eb6834" stroke-width="1.8" marker-end="url(#aO)"/>
  <!-- cross-lane: resource SA -> compress -> ope CA (aqua) -->
  <path d="M470,488 L470,452 L590,452 L590,378" fill="none" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="598" y="414" class="k" style="fill:#1baf7a">時間を 300 → 16 に圧縮</text>

  <!-- input arrows -->
  <line x1="320" y1="140" x2="366" y2="150" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#aB)"/>
  <path d="M320,172 L340,172 L340,206 L640,206 L640,196" fill="none" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aB)"/>
  <path d="M320,262 L335,262 L335,274 L795,274 L795,306" fill="none" stroke="#8a8984" stroke-width="1.6" marker-end="url(#aK)"/>
  <line x1="320" y1="342" x2="366" y2="342" stroke="#eb6834" stroke-width="1.6" marker-end="url(#aO)"/>
  <line x1="320" y1="510" x2="366" y2="516" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#aA)"/>

  <!-- diffusion step conditioning -->
  <rect x="350" y="590" width="640" height="46" rx="8" class="box"/>
  <text x="370" y="619" class="t">拡散のステップ t → 正弦波の埋め込み → MLP → c。全ブロックを adaLN-Zero で条件づける</text>
  <line x1="670" y1="590" x2="670" y2="568" stroke="#8a8984" stroke-width="1.6" marker-end="url(#aK)"/>

  <!-- ===== outputs ===== -->
  <text x="1020" y="92" class="k">出力</text>
  <rect x="1020" y="104" width="280" height="88" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="1034" y="128" class="h">敵の時系列（補助）</text>
  <text x="1034" y="152" class="s">各秒の存在・位置・HP</text>
  <text x="1034" y="172" class="s">学習の教師あり</text>
  <line x1="970" y1="160" x2="1016" y2="160" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#aB)"/>

  <rect x="1020" y="236" width="280" height="212" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.2"/>
  <text x="1034" y="260" class="h">計画の x0 の予測（1 枠ごと）</text>
  <text x="1034" y="286" class="s">・出す時刻・退く時刻・枠を使うか</text>
  <text x="1034" y="308" class="s">・向き（4 通り）</text>
  <text x="1034" y="330" class="s">・升（117）: 枠の表現と盤面トークン</text>
  <text x="1034" y="348" class="s">　の内積 ＋ 射程の被覆 × 学習する重み</text>
  <text x="1034" y="370" class="s">・スキルを使う時刻と旗（7 列）</text>
  <text x="1034" y="398" class="k">置けない升は logits のマスクで除く</text>
  <text x="1034" y="418" class="k">升以外は最後の層（adaLN＋線形）から</text>
  <line x1="970" y1="342" x2="1016" y2="342" stroke="#eb6834" stroke-width="1.6" marker-end="url(#aO)"/>

  <rect x="1020" y="464" width="280" height="88" rx="8" fill="#e5f5ef" stroke="#1baf7a" stroke-width="1.2"/>
  <text x="1034" y="488" class="h">資源の時系列（補助）</text>
  <text x="1034" y="512" class="s">各秒の配置コスト、枠ごとの HP・SP・</text>
  <text x="1034" y="532" class="s">スキルの発動回数。学習の教師あり</text>
  <line x1="970" y1="520" x2="1016" y2="520" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#aA)"/>

  <!-- ===== sampling ===== -->
  <rect x="20" y="668" width="1280" height="104" rx="10" fill="#f3f2ee" stroke="#c9c8c2" stroke-width="1"/>
  <text x="40" y="696" class="h">計画の生成</text>
  <text x="40" y="722" class="t">純粋なノイズの x_t から、100 ステップの逆拡散で x0 を予測しながらノイズを除く（DDPM、ancestral sampling）。</text>
  <text x="40" y="746" class="t">1 件の条件から 32 本を生成し、すべてを評価用のシミュレーターで実行して勝ち負けを判定する。</text>
</svg>
